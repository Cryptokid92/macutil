name: macutil Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  macos-app:
    uses: ./.github/workflows/macos-app.yml

  publish:
    needs: macos-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          bash scripts/check-version.sh
          version=$(sed -n 's/.*<CFBundleVersion>\([^<]*\)<\/CFBundleVersion>.*/\1/p' MacUtilGUI/MacUtilGUI.fsproj | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: MacUtil-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Pre-Release ${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ./artifacts/MacUtil-Universal.zip
            ./artifacts/MacUtil-macos-x64.zip
            ./artifacts/MacUtil-macos-arm64.zip
            ./artifacts/MacUtil-${{ steps.version.outputs.version }}.dmg
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
