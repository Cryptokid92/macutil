name: macOS App

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "MacUtilGUI/**"
      - "config/**"
      - "scripts/check-version.sh"
      - "scripts/make-dmg.sh"
      - ".github/workflows/macos-app.yml"
      - ".github/workflows/Release.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "MacUtilGUI/**"
      - "config/**"
      - "scripts/check-version.sh"
      - "scripts/make-dmg.sh"
      - ".github/workflows/macos-app.yml"
      - ".github/workflows/Release.yml"

permissions:
  contents: read

jobs:
  macos-14:
    name: macos-14
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache .NET packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Check version lock
        run: bash scripts/check-version.sh

      - name: Build DMG
        run: bash scripts/make-dmg.sh

      - name: Smoke osx-arm64
        run: |
          set -euo pipefail
          chmod +x ./dist/publish/osx-arm64/MacUtilGUI
          ./dist/publish/osx-arm64/MacUtilGUI > /tmp/macutil-smoke.log 2>&1 &
          pid=$!
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "smoke failed: osx-arm64 process died before 8s" >&2
            cat /tmp/macutil-smoke.log >&2 || true
            exit 1
          fi
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo "smoke ok: osx-arm64 pid $pid stayed up 8s"

      - name: Verify universal app and DMG
        run: |
          set -euo pipefail
          app="./dist/MacUtil.app"
          test -d "$app"
          test -f "$app/Contents/MacOS/config/tweaks.json"
          chmod +x "$app/Contents/MacOS/MacUtilGUI"
          lipo -info "$app/Contents/MacOS/MacUtilGUI"
          lipo -info "$app/Contents/MacOS/MacUtilGUI" | grep x86_64
          lipo -info "$app/Contents/MacOS/MacUtilGUI" | grep arm64
          version=$(sed -n 's/.*<CFBundleVersion>\([^<]*\)<\/CFBundleVersion>.*/\1/p' MacUtilGUI/MacUtilGUI.fsproj | head -n 1)
          dmg="./dist/MacUtil-${version}.dmg"
          test -f "$dmg"
          file "$dmg"
          hdiutil imageinfo "$dmg"
          if [ -e /Volumes/MacUtil ]; then
            hdiutil detach /Volumes/MacUtil || true
          fi
          hdiutil attach -nobrowse "$dmg"
          cleanup() { hdiutil detach /Volumes/MacUtil 2>/dev/null || true; }
          trap cleanup EXIT
          test -d /Volumes/MacUtil/MacUtil.app
          test -L /Volumes/MacUtil/Applications
          test "$(readlink /Volumes/MacUtil/Applications)" = "/Applications"
          test -f /Volumes/MacUtil/MacUtil.app/Contents/MacOS/config/tweaks.json
          hdiutil detach /Volumes/MacUtil
          trap - EXIT

      - name: Upload Intel app
        uses: actions/upload-artifact@v4
        with:
          name: MacUtil-macos-x64
          path: ./dist/MacUtil-macos-x64.zip
          if-no-files-found: error

      - name: Upload Apple Silicon app
        uses: actions/upload-artifact@v4
        with:
          name: MacUtil-macos-arm64
          path: ./dist/MacUtil-macos-arm64.zip
          if-no-files-found: error

      - name: Upload universal app
        uses: actions/upload-artifact@v4
        with:
          name: MacUtil-Universal
          path: ./dist/MacUtil-Universal.zip
          if-no-files-found: error

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: MacUtil-dmg
          path: ./dist/MacUtil-*.dmg
          if-no-files-found: error
