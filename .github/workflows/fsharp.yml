name: F# Checks

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - '**/*.fs'
      - '**/*.fsproj'
      - 'MacUtilGUI/**'
      - 'MacUtilGUI.Tests/**'
      - 'config/**'
  pull_request:
    branches: ["main"]
    paths:
      - '**/*.fs'
      - '**/*.fsproj'
      - 'MacUtilGUI/**'
      - 'MacUtilGUI.Tests/**'
      - 'config/**'

jobs:
  lints:
    name: F# Build and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache .NET packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: |
          dotnet restore MacUtilGUI/MacUtilGUI.fsproj
          dotnet restore MacUtilGUI.Tests/MacUtilGUI.Tests.fsproj

      - name: Install Fantomas
        run: |
          dotnet tool install -g fantomas
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Build project
        run: dotnet build MacUtilGUI/MacUtilGUI.fsproj --configuration Release --no-restore

      - name: Check F# formatting
        run: fantomas --check MacUtilGUI/Models/Pref.fs MacUtilGUI/Models/Action.fs MacUtilGUI/ViewModels MacUtilGUI/Program.fs MacUtilGUI/Services/ConfigLoader.fs MacUtilGUI.Tests/ConfigSchemaTests.fs

      - name: Test Action registry
        run: dotnet test MacUtilGUI.Tests/MacUtilGUI.Tests.fsproj --configuration Release --logger "console;verbosity=normal"
